# Mifgash (Meta hackathon). Django rate limits per IP and per key; nginx adds a coarse cap.
limit_req_zone $binary_remote_addr zone=mifgash_api:10m rate=5r/s;

server {
    listen 80;
    server_name mifgash.sveder.com;
    client_max_body_size 256k;

    location /static/ {
        alias /srv/www/mifgash/static/;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        limit_req zone=mifgash_api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/mifgash-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/mifgash-proxy.conf;
    }

    access_log /var/log/nginx/mifgash.access.log;
    error_log  /var/log/nginx/mifgash.error.log;
}
